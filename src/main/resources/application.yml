spring:
  application:
    name: lab
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:h2:file:./data/db
  jpa:
    hibernate:
      ddl-auto: update

lab:
  instructor-username: ${INSTRUCTOR_USERNAME:instructor}
  # 기본값이면 시작할 때 WARN을 남긴다. 학생 컨테이너가 이 서버의 강사 API에 닿으므로 학생에게 IDE를 주기 전에 바꾼다.
  instructor-password: ${INSTRUCTOR_PASSWORD:instructor}
  # output_config.effort(low)는 Claude 5 계열(claude-haiku-5, claude-sonnet-5, claude-opus-5, claude-fable-5로 시작하는 id)에만 보낸다.
  # 다른 모델로 바꾸면 effort 없이 모델 기본값으로 호출한다. effort를 모르는 모델에 보내면 모든 호출이 400이 된다.
  llm-model: ${LLM_MODEL:claude-haiku-5-5}
  check-interval-seconds: ${CHECK_INTERVAL_SECONDS:15}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  ide-bind-address: ${IDE_BIND_ADDRESS:127.0.0.1}
  # 학생 화면의 IDE 주소. {base}=public-base-url, {host}=그 호스트, {port}=학생 IDE 포트.
  # 배포(HTTPS 리버스 프록시)에서는 {base}/ide/{port}/ 로 바꾼다. http 직접 포트로는 실습 도우미 패널이 뜨지 않는다.
  ide-url-template: ${IDE_URL_TEMPLATE:http://{host}:{port}/}
  data-dir: ./data
  # :2부터 IDE 도움 패널 확장("실습 도우미")이 들어 있다. scripts/build-base-image.sh로 만든다.
  base-image: swunion/lab-base:2
  course-image-prefix: swunion/course-
  container-name-prefix: swunion-s
  # 학생 컨테이너가 서버에 닿는 주소(IDE 안 확장이 쓴다). 서버를 8080이 아닌 포트로 띄우면 같이 바꾼다.
  server-url-for-containers: ${SERVER_URL_FOR_CONTAINERS:http://host.docker.internal:8080}
  check-enabled: ${CHECK_ENABLED:true}
  # 학생 컨테이너 하나의 메모리 상한(MB). 256 미만이면 서버가 시작하지 않는다.
  container-memory-mb: ${CONTAINER_MEMORY_MB:800}
