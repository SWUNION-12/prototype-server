plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.swunion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// 이 머신에는 JDK 26만 있으므로 툴체인 대신 release 21로 바이트코드 수준을 고정한다.
tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.github.docker-java:docker-java-core:3.5.1'
	implementation 'com.github.docker-java:docker-java-transport-httpclient5:3.5.1'
	implementation 'org.apache.commons:commons-compress:1.28.0'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 태그 없음 = 단위 테스트. Docker/네트워크/API 키가 필요한 테스트는 별도 태스크로 분리한다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration', 'llm'
	}
}

// llm+integration 이중 태그 테스트가 두 태스크에서 중복 실행되지 않도록 llm은 llmTest에서만 돈다.
tasks.register('integrationTest', Test) {
	description = 'Docker, uv, 네트워크가 필요한 integration 태그 테스트'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
		excludeTags 'llm'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('llmTest', Test) {
	description = '실제 API 키가 필요한 llm 태그 테스트'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'llm'
	}
	shouldRunAfter tasks.named('test')
}

// JDK 26에서 테스트 JVM의 javaagent(Mockito 등)가 부트스트랩 클래스패스를 덧붙이면 CDS 경고가 나온다.
// 테스트에서는 CDS가 필요 없으므로 끈다. 세 테스트 태스크에 공통 적용.
tasks.withType(Test).configureEach {
	jvmArgs '-Xshare:off'
}

// 화면(web/)은 Next.js 정적 빌드다. bootJar만 이 결과(web/out)를 jar의 static/ 자리에 담는다.
// test와 compileJava는 웹 빌드에 기대지 않으므로 Node와 pnpm이 없어도 돈다.
def webDir = layout.projectDirectory.dir('web')

tasks.register('webInstall', Exec) {
	description = 'web/의 의존성을 잠금 파일 그대로 설치한다'
	group = 'build'
	// pnpm이 없으면 Exec은 "프로세스를 시작하지 못했다"만 내서 원인을 알기 어렵다. 실행하지 않고 PATH에서 찾는다.
	// (pnpm --version은 web/의 packageManager 버전을 내려받으려 할 수 있어 쓰지 않는다.)
	doFirst {
		def names = ['pnpm', 'pnpm.cmd', 'pnpm.exe']
		def found = (System.getenv('PATH') ?: '').split(File.pathSeparator).any { dir ->
			dir && names.any { new File(dir, it).canExecute() }
		}
		if (!found) {
			throw new GradleException('pnpm이 필요합니다 (Node 20.9 이상, pnpm은 package.json의 packageManager 버전으로 자동 전환)')
		}
	}
	workingDir webDir
	commandLine 'pnpm', 'install', '--frozen-lockfile'
	inputs.files(webDir.file('package.json'), webDir.file('pnpm-lock.yaml'), webDir.file('pnpm-workspace.yaml'))
	outputs.dir webDir.dir('node_modules')
}

tasks.register('webBuild', Exec) {
	description = 'web/을 정적 파일(web/out)로 빌드한다'
	group = 'build'
	dependsOn 'webInstall'
	workingDir webDir
	commandLine 'pnpm', 'build'
	inputs.dir webDir.dir('src')
	// public/은 없을 수 있어 files로 받는다(dir 입력은 폴더가 없으면 실패한다).
	inputs.files(webDir.dir('public'))
	inputs.files(webDir.file('package.json'), webDir.file('pnpm-lock.yaml'), webDir.file('next.config.ts'),
			webDir.file('tsconfig.json'), webDir.file('pnpm-workspace.yaml'))
	// NEXT_PUBLIC_* 값은 빌드 때 out에 박힌다. .env* 파일이 없어도 되는 fileTree로 받는다.
	inputs.files(fileTree(dir: webDir.asFile, include: '.env*'))
	outputs.dir webDir.dir('out')
}

tasks.named('bootJar') {
	from(tasks.named('webBuild')) {
		into 'BOOT-INF/classes/static'
	}
}
